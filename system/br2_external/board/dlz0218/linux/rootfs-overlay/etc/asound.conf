# HDMI hardware: signed 32-bit containers, 48kHz stereo; PL keeps high 16 bits.
# plug converts S16_LE and other application formats/rates to this fixed ABI.
pcm.!hdmi {
    type plug
    hint.description "DLZ0218 HDMI stereo, 48 kHz PCM16"
    slave {
        pcm "hw:CARD=DLZ0218HDMI,DEV=0"
        format S32_LE
        rate 48000
        channels 2
    }
}
pcm.!default { type plug slave.pcm "hdmi" }
ctl.!default { type hw card "DLZ0218HDMI" }
